<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Dark Background Container -->
  <rect width="64" height="64" rx="14" fill="#0A0A0B" />
  
  <!-- Outer Circular Circuit Ring -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="#A1A1AA" stroke-width="2.5" stroke-opacity="0.85" />
  
  <!-- Internal Circuit Nodes & Paths -->
  <!-- Vertical main trace -->
  <path d="M 32 12 L 32 30 L 40 38 L 40 48" fill="none" stroke="#F4F4F5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="40" cy="48" r="2.5" fill="#22D3EE" />
  
  <!-- Left branch trace -->
  <path d="M 32 20 L 22 20 L 16 26 L 16 40" fill="none" stroke="#F4F4F5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="16" cy="40" r="2.5" fill="#22D3EE" />
  
  <!-- Center junction trace -->
  <path d="M 22 28 L 28 28 L 28 44" fill="none" stroke="#F4F4F5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="28" cy="44" r="2" fill="#38BDF8" />
  <circle cx="22" cy="28" r="2" fill="#38BDF8" />
  
  <!-- Top node -->
  <circle cx="32" cy="12" r="2.5" fill="#22D3EE" />
  <circle cx="26" cy="16" r="2" fill="#A1A1AA" />
  <path d="M 26 16 L 30 16" fill="none" stroke="#A1A1AA" stroke-width="1.8" />
</svg>
