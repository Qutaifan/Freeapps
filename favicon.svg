<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="THEHUB">
  <title>THEHUB</title>
  <!--
    THEHUB mark, reduced for favicon sizes.

    The navbar mark carries six satellites, two counter-rotating rings and six
    spokes. None of that survives at 16px, where one viewBox unit is half a
    device pixel: the rings merge, the spokes vanish and the satellites smear
    into the orbit. This is the same idea drawn with three shapes — core, orbit,
    three satellites — chosen so each one is at least ~1.5px across at 16px.

    The tile is deliberately opaque: a transparent mark in this palette
    disappears against light browser chrome. The orbit ring doubles as the
    tile's edge definition so it still reads against dark chrome too.

    Replaces a 142KB file that was a 512x512 PNG base64-embedded inside an SVG
    wrapper — no vector content at all, fetched in full to paint a tab icon.
  -->
  <defs>
    <radialGradient id="hubCore" cx="38%" cy="34%" r="70%">
      <stop offset="0" stop-color="#E0F7FF"/>
      <stop offset=".45" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </radialGradient>
  </defs>

  <rect width="32" height="32" rx="7" fill="#0A0A0B"/>

  <circle cx="16" cy="16" r="11" fill="none" stroke="#22D3EE" stroke-opacity=".45" stroke-width="1.5"/>

  <circle cx="16" cy="5" r="2.8" fill="#67E8F9"/>
  <circle cx="25.53" cy="21.5" r="2.8" fill="#38BDF8"/>
  <circle cx="6.47" cy="21.5" r="2.8" fill="#38BDF8"/>

  <circle cx="16" cy="16" r="6" fill="url(#hubCore)"/>
</svg>
